      <symbol id="i-eraser" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4l5 5-10 10H6l-3-3z"/><path d="M10 10l5 5M11 19h10"/></symbol>

      <symbol id="i-wand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20L15 9"/><path d="M15 4v2M19 8h2M18 5l1.5-1.5M13 9l2 2M20 12l-1-1"/></symbol>

  <canvas id="scene" aria-hidden="true" tabindex="-1"></canvas>
  <div id="starfield" aria-hidden="true"></div>
  <div id="scene-labels" aria-hidden="true"></div>
  <div id="veil" aria-hidden="true"></div>
  <div class="scanlines" aria-hidden="true"></div>

  <div id="boot" class="boot" role="status" aria-live="polite">
    <div class="boot-box">
      <div class="boot-logo">
        <svg><use href="#i-logo"/></svg>
        <div><div class="n">INNI</div><div class="s">학교 물품 보급 함교</div></div>
      </div>
      <div class="boot-lines" id="boot-lines"></div>
      <div class="boot-bar"><i id="boot-bar"></i></div>
    </div>
  </div>

  <section id="login" class="login" hidden></section>

  <div id="app" class="app" hidden>
    <header class="hud">
      <button class="brand" type="button" id="brand" title="inni 보급 함교 — 함교로">
        <svg class="brand-mark"><use href="#i-logo"/></svg>
        <span class="brand-name">INNI</span>
      </button>
      <div class="hud-title"><span class="code" id="hud-code">STATION 01 · BRIDGE</span><span class="name" id="hud-name">함교</span></div>
      <div class="omni-slot" id="omni-slot"></div>
      <button class="condition" id="hud-condition" type="button" data-level="green" title="경보 보기"><span class="led good" id="hud-condition-led"></span><span class="cc" id="hud-condition-code">CONDITION GREEN</span><span class="ct" id="hud-condition-text">이상 없음</span></button>
      <div class="lights" id="hud-lights"></div>
      <div class="clock"><div class="t num" id="hud-clock">--:--:--</div><div class="d" id="hud-date"></div></div>
      <div class="hud-actions">
        <button class="icon-btn only-mobile" id="btn-search-m" type="button" title="찾기"><svg><use href="#i-search"/></svg></button>
        <button class="icon-btn hide-mobile" id="btn-add" type="button" title="새 물건 등록 (N)"><svg><use href="#i-plus"/></svg></button>
        <button class="icon-btn hide-mobile" id="btn-scan" type="button" title="스캔 (S)"><svg><use href="#i-scan"/></svg></button>
        <button class="icon-btn hide-mobile hide-tablet" id="btn-auto" type="button" aria-pressed="false" title="상황판 모드 (A)"><svg><use href="#i-cycle"/></svg></button>
        <button class="icon-btn hide-mobile hide-tablet" id="btn-3d" type="button" aria-pressed="true" title="3D 선내 지도 켜기/끄기 (T)"><svg><use href="#i-cube"/></svg></button>
        <button class="icon-btn hide-mobile" id="btn-sound" type="button" aria-pressed="true" title="효과음 (M)"><svg><use href="#i-volume"/></svg></button>
        <button class="icon-btn hide-mobile hide-tablet" id="btn-full" type="button" title="전체 화면 (F)"><svg><use href="#i-full"/></svg></button>
        <button class="icon-btn hide-mobile" id="btn-help" type="button" title="도움말·단축키 (?)"><svg><use href="#i-help"/></svg></button>
        <div class="who"><button class="avatar" id="hud-who" type="button" title="내 계정"></button></div>
      </div>
    </header>
    <nav class="rail" id="rail" aria-label="스테이션"></nav>
    <main class="stage" id="stage">
      <section class="station" id="st-bridge" data-station="bridge" aria-label="함교"></section>
      <section class="station" id="st-search" data-station="search" aria-label="찾기"></section>
      <section class="station" id="st-decks" data-station="decks" aria-label="장소"></section>
      <section class="station" id="st-dock" data-station="dock" aria-label="입출항"></section>
      <section class="station" id="st-audit" data-station="audit" aria-label="실사"></section>
      <section class="station" id="st-repair" data-station="repair" aria-label="정비"></section>
      <section class="station" id="st-log" data-station="log" aria-label="기록"></section>
      <section class="station" id="st-crew" data-station="crew" aria-label="승무원"></section>
      <section class="station" id="st-systems" data-station="systems" aria-label="시스템"></section>
      <section class="station" id="st-item" data-station="item" aria-label="물건"></section>
    </main>
    <footer class="foot" id="foot">
      <span class="lbl">COMMS</span>
      <div class="ticker" id="ticker" aria-label="최근 기록"><div class="ticker-track" id="ticker-track"><span class="tk muted">통신 대기 중…</span></div></div>
      <span class="auto-state" id="auto-state"></span>
      <span class="live" id="live-state" title="실시간 연결"><i class="led"></i><span>LIVE</span></span>
    </footer>
    <nav class="tabbar" id="tabbar" aria-label="아래 메뉴"></nav>
  </div>

  <div id="toasts" role="status" aria-live="polite"></div>
  <div id="overlay-root"></div>
  <div id="print-root"></div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
